<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استوديو لقطة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E7BF0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&family=Amiri:wght@700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: glass header + segmented tabs (desktop top / iOS tab bar on phones), preview card beside a tool panel, full-width timeline below. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F4F7FC; --fill:rgba(110,128,170,.13); --fill-2:rgba(110,128,170,.22);
  --fg:#0A1428; --muted:#5D6880; --sep:rgba(40,60,110,.12);
  --blue-1:#5AC8FA; --blue-2:#1E7BF0; --blue-3:#0A3A9A;
  --grad:linear-gradient(135deg,var(--blue-1) 0%,var(--blue-2) 50%,var(--blue-3) 100%);
  --accent:#1468E0; --on-accent:#FFFFFF; --stage:#0B1220; --track:#E7ECF5;
  --text-chip:#F59E0B; --audio-chip:#22A55A; --danger:#E5383B;
  --glass:rgba(255,255,255,.74); --shadow:0 1px 2px rgba(10,30,70,.05),0 10px 30px rgba(10,30,70,.07);
  --font:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05080F; --surface:#10151F; --surface-2:#161C29; --fill:rgba(140,160,210,.13); --fill-2:rgba(140,160,210,.22);
  --fg:#EDF1F9; --muted:#8C97AE; --sep:rgba(255,255,255,.08);
  --blue-1:#64D2FF; --blue-2:#2F86FF; --blue-3:#1446B8; --accent:#4AA3FF; --stage:#000000; --track:#0B1019;
  --glass:rgba(12,16,26,.74); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05080F; --surface:#10151F; --surface-2:#161C29; --fill:rgba(140,160,210,.13); --fill-2:rgba(140,160,210,.22);
  --fg:#EDF1F9; --muted:#8C97AE; --sep:rgba(255,255,255,.08);
  --blue-1:#64D2FF; --blue-2:#2F86FF; --blue-3:#1446B8; --accent:#4AA3FF; --stage:#000000; --track:#0B1019;
  --glass:rgba(12,16,26,.74); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass)}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.top .inner{max-width:1400px;margin:0 auto;height:58px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(30,123,240,.35);flex:none}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;transition:transform .15s,background .2s;flex:none}
.icon-btn:hover{background:var(--fill-2)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.35;cursor:default}
.pill-btn{height:38px;padding:0 14px;border-radius:19px;background:var(--fill);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.grad-btn{height:38px;padding:0 16px;border-radius:19px;background:var(--grad);color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(30,123,240,.3);flex:none;transition:transform .15s}
.grad-btn:active{transform:scale(.96)}

/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--fill);border-radius:14px;margin:14px auto 0;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tab .ti{display:grid;place-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(30,123,240,.3)}

/* Workspace */
.app{max-width:1400px;margin:0 auto;padding-block:0 8px}
.ws{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr) 390px;grid-template-areas:"stage panel" "tl tl"}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--sep)}
.stage-card{grid-area:stage;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;height:clamp(300px,58vh,660px);border-radius:14px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
#cv{display:block;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
.exp-ov{position:absolute;inset:0;background:rgba(5,10,20,.55);display:grid;place-items:center;color:#fff;font-weight:600;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.exp-ov .pct{font-size:40px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#9BE3FF,#5AA8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.ratio-tag{position:absolute;top:10px;inset-inline-start:10px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);direction:ltr}

.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.transport .side{display:flex;gap:6px;align-items:center}
.transport .side.end{justify-content:flex-end}
.tcenter{display:flex;align-items:center;gap:10px}
.play{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(30,123,240,.38);transition:transform .15s}
.play:active{transform:scale(.92)}
.time{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);direction:ltr;min-width:106px;text-align:center}
.time b{color:var(--fg);font-weight:600}

/* Panel */
.panel{grid-area:panel;padding:18px;min-width:0;overflow:auto;max-height:calc(58vh + 100px);display:flex;flex-direction:column;gap:14px}
.ph h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grp{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.grp h3{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.ctl-h output{font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--blue-1),var(--blue-2) var(--p),var(--fill-2) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--fill-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:linear-gradient(to right,var(--blue-1),var(--blue-2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;transition:background .15s;direction:inherit}
.chip:hover{background:var(--fill-2)}
.chip.on{background:var(--grad);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:12px;background:var(--fill);font-weight:600;font-size:14px;transition:background .15s,transform .15s}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(30,123,240,.28)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--fill);font-size:11.5px;font-weight:500;transition:background .15s}
.act:hover{background:var(--fill-2)}
.act.danger{color:var(--danger)}
.act.on{background:var(--grad);color:#fff}
.sw-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer}
.switch{-webkit-appearance:none;appearance:none;width:48px;height:29px;border-radius:15px;background:var(--fill-2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.switch:checked{background:#34C759}
.switch:checked::after{inset-inline-start:21px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 14px;border-radius:16px;border:1.5px dashed var(--fill-2);text-align:center;cursor:pointer;color:var(--muted);transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--fill)}
.drop b{color:var(--fg);font-size:15px}
.drop .di{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;margin-bottom:6px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--fill);font-size:13px}
.note > svg{flex:none;color:var(--accent);margin-top:1px}
.note div{flex:1;min-width:0;display:flex;flex-direction:column}
.note span{color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lib-item{aspect-ratio:1;border-radius:12px;background:#1b2333 center/cover no-repeat;position:relative;overflow:hidden}
.lib-item span{position:absolute;bottom:5px;inset-inline-end:5px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;direction:ltr}
.lib-item::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px;background:rgba(10,58,154,.45);opacity:0;transition:opacity .2s}
.lib-item:hover::after{opacity:1}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--muted)}
.empty .ei{width:56px;height:56px;border-radius:18px;background:var(--fill);display:grid;place-items:center;color:var(--accent)}
.empty b{color:var(--fg);font-size:15px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--fill);text-align:start;width:100%}
.li.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.li .dot{width:10px;height:10px;border-radius:3px;flex:none}
.li .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.li small{color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:76px;resize:vertical;border-radius:12px;border:1px solid var(--sep);background:var(--surface);padding:10px 12px;font-size:15px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swt{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.swt.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
input[type=color]{width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fonts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fontb{padding:10px 4px;border-radius:12px;background:var(--fill);font-size:18px;line-height:1.2}
.fontb.on{background:var(--grad);color:#fff}
.fontb small{display:block;font-size:10px;font-family:var(--font);opacity:.75;margin-top:2px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.pre{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
.pre canvas{width:100%;aspect-ratio:1;border-radius:12px;background:#1b2333;display:block}
.pre.on{color:var(--accent)}
.pre.on canvas{box-shadow:0 0 0 2.5px var(--accent)}
.ratios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--fill);font-size:12px;text-align:center}
.rat .shape{height:40px;display:grid;place-items:center}
.rat .shape i{display:block;border:2px solid currentColor;border-radius:5px}
.rat b{font-size:14px;direction:ltr}
.rat span{color:var(--muted);font-size:11px;line-height:1.3}
.rat.on{background:var(--grad);color:#fff}
.rat.on span{color:rgba(255,255,255,.85)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.bar{height:8px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .2s}
.result video{width:100%;border-radius:12px;background:#000;max-height:320px}
.hint{font-size:12px;color:var(--muted)}

/* Timeline */
.tl-card{grid-area:tl;padding:12px 0 14px;min-width:0}
.tl-head{display:flex;align-items:center;gap:8px;padding:0 14px 8px}
.tl-head h3{font-size:13px;font-weight:600;color:var(--muted)}
.tl{position:relative;direction:ltr}
.tl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.tl-scroll::-webkit-scrollbar{display:none}
.tl-inner{position:relative;display:flex;flex-direction:column;gap:6px;padding-bottom:2px}
.ruler{height:18px;position:relative}
.ruler span{position:absolute;top:0;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:var(--fill-2)}
.track{position:relative;height:36px;border-radius:8px;background:var(--track)}
.track.v{height:66px;background:transparent}
.blk{position:absolute;top:0;bottom:0;border-radius:9px;overflow:hidden;display:flex;align-items:flex-end;cursor:pointer;user-select:none;-webkit-user-select:none}
.clipb{background-color:#1b2333;background-position:left center;background-size:auto 100%;background-repeat:repeat-x;border:2px solid var(--surface);color:#fff}
.clipb .cl{font-size:10.5px;padding:2px 6px;margin:4px;background:rgba(0,0,0,.55);border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.clipb.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent);z-index:2}
.clipb .trm{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-style:normal}
.txb,.aub{align-items:center;padding:0 8px;font-size:11.5px;font-weight:600;color:#fff}
.txb{background:var(--text-chip)}
.aub{background-color:var(--audio-chip);background-repeat:no-repeat}
.txb span,.aub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.txb.sel,.aub.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);z-index:2}
.playhead{position:absolute;top:18px;bottom:-4px;left:50%;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;border-radius:2px;z-index:5}
.playhead::before{content:"";position:absolute;top:-7px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 2px var(--surface)}
.tl-empty{position:absolute;inset:18px 0 0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
.tl-head .hint{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{-webkit-touch-callout:none}
.tl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hdl{position:absolute;top:0;bottom:0;width:22px;background:#fff;display:grid;place-items:center;touch-action:none;cursor:ew-resize;z-index:3;font-style:normal}
.hdl::after{content:"";width:3px;height:42%;border-radius:2px;background:var(--blue-2)}
.hdl.l{left:0}.hdl.r{right:0}
.txb.sel,.aub.sel{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--accent)}
.txb.sel span,.aub.sel span{padding-inline:12px}
.blk.lifted{transform:scale(1.06) translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:6;transition:transform .15s}
.blk.moving{opacity:.92;z-index:6;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:none}
.add-end{position:absolute;top:6px;bottom:6px;width:52px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--accent)}
.add-end:hover{background:var(--fill-2)}
.tl-labels{position:absolute;left:8px;top:24px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:4}
.tl-labels span{width:28px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--glass);color:var(--muted);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 .5px var(--sep)}
.tl-labels span.v{height:66px}
.ctx{position:fixed;z-index:95;min-width:220px;max-width:calc(100vw - 24px);padding:6px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 .5px var(--sep);animation:ctxIn .18s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.ctx-h{padding:6px 12px 4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-i{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:11px 12px;border-radius:10px;font-size:15px;text-align:start}
.ctx-i:hover,.ctx-i:focus-visible{background:var(--fill)}
.ctx-i.danger{color:var(--danger)}
.ctx hr{border:0;height:1px;background:var(--sep);margin:4px 6px}
/* Quick tools (long-press) */
.qt{position:fixed;z-index:96;width:min(560px,calc(100vw - 24px));background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3),0 0 0 .5px var(--sep);overflow:hidden;animation:ctxIn .18s ease-out}
.qt-h{display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
.qt-k{font-size:11px;font-weight:600;color:#fff;background:var(--grad);padding:2px 9px;border-radius:20px;flex:none}
.qt-h b{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const icon = (n,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- state ---------- */
const FONTS = {plex:'"IBM Plex Sans Arabic",sans-serif', lalezar:'"Lalezar","IBM Plex Sans Arabic",sans-serif', amiri:'"Amiri",serif', reem:'"Reem Kufi","IBM Plex Sans Arabic",sans-serif'};
const PRESETS = {none:{}, vivid:{c:1.12,s:1.45}, warm:{sep:.28,s:1.2,b:1.03}, cool:{h:-14,s:1.05,b:1.02,c:1.05}, mono:{g:1}, noir:{g:1,c:1.45,b:.92}, vintage:{sep:.5,c:.9,b:1.06,s:.85}, fade:{c:.82,b:1.1,s:.75}, drama:{c:1.35,s:1.15,b:.93}};
const PRESET_LABEL = {none:'pNone',vivid:'pVivid',warm:'pWarm',cool:'pCool',mono:'pMono',noir:'pNoir',vintage:'pVintage',fade:'pFade',drama:'pDrama'};
const TRS = [['none','trNone'],['fade','trFade'],['white','trWhite'],['zoom','trZoom'],['slide','trSlide'],['blur','trBlur']];
const TD = 0.6;

const S = {ratio:'9:16', bg:{type:'blur', color:'#0B1220', amt:40}, clips:[], texts:[], audios:[], exp:{q:720, fps:30}, sample:true};
const SRC = {};
let sel = null, tab = 'media', T = 0, playing = false, playStartT = 0, playStartNow = 0, dirty = true, pps = 60;
let holdSince = 0, textBoxes = [], exp = null, result = null, recState = null;

const newClip = (kind, o={}) => Object.assign({id:uid(), kind, srcId:null, name:'', in:0, out:3, dur:3, speed:1, vol:1, muted:false,
  tf:{rot:0, fh:false, fv:false, zoom:1, fit:'fit'}, fx:{p:'none', bri:0, con:0, sat:0, warm:0, vig:0}, tr:'none', color:'#5AC8FA', color2:'#0A3A9A'}, o);
const newText = (o={}) => Object.assign({id:uid(), text:t('newText'), start:0, end:3, x:.5, y:.5, size:8, color:'#FFFFFF', font:'plex', bold:true, style:'shadow', bg:'#0A3A9A', anim:'pop'}, o);

function seedSample(){
  S.clips = [newClip('color',{dur:4, color:'#5AC8FA', color2:'#0A3A9A'}), newClip('color',{dur:4, color:'#1E7BF0', color2:'#071733', tr:'fade'})];
  S.texts = [newText({text:t('sampleTitleText'), start:0, end:4, y:.45, size:16, font:'lalezar', anim:'pop'}),
             newText({text:t('sampleSubText'), start:4.2, end:8, y:.5, size:6.5, style:'box', anim:'slide', bold:true})];
  S.sample = true;
}
seedSample();

const clipLen = c => c.kind==='video' ? Math.max(0.05,(c.out-c.in)/c.speed) : c.dur;
function layout(){ let s=0; return S.clips.map(c=>{const o={c,start:s,len:clipLen(c)}; s+=o.len; return o;}); }
const total = () => S.clips.reduce((a,c)=>a+clipLen(c),0);
function currentAt(time){ const L=layout(); for(let i=0;i<L.length;i++){ if(time < L[i].start+L[i].len) return Object.assign(L[i],{idx:i}); } return L.length ? Object.assign(L[L.length-1],{idx:L.length-1}) : null; }
const selClip = () => sel&&sel.type==='clip' ? S.clips.find(c=>c.id===sel.id) : null;
const selText = () => sel&&sel.type==='text' ? S.texts.find(c=>c.id===sel.id) : null;
const selAudio = () => sel&&sel.type==='audio' ? S.audios.find(c=>c.id===sel.id) : null;
function ratioWH(r, short){ const [a,b]=r.split(':').map(Number); const even=v=>Math.round(v/2)*2; return a<b ? [short, even(short*b/a)] : [even(short*a/b), short]; }

/* ---------- history ---------- */
let hist=[], fut=[];
const snap = () => JSON.stringify({S, sel});
let lastSnap = snap();
function commit(){ const s=snap(); if(s===lastSnap) return; hist.push(lastSnap); if(hist.length>80) hist.shift(); fut=[]; lastSnap=s; updUndo(); }
function restore(s){ const o=JSON.parse(s); Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,o.S); sel=o.sel; T=clamp(T,0,total()); applyRatio(false); renderAll(); }
function undo(){ if(!hist.length||exp) return; fut.push(lastSnap); lastSnap=hist.pop(); restore(lastSnap); updUndo(); }
function redo(){ if(!fut.length||exp) return; hist.push(lastSnap); lastSnap=fut.pop(); restore(lastSnap); updUndo(); }
function updUndo(){ $('#undoBtn').disabled=!hist.length; $('#redoBtn').disabled=!fut.length; }

/* ---------- audio graph ---------- */
let AC=null, master=null, monitor=null, recDest=null;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); monitor = AC.createGain(); recDest = AC.createMediaStreamDestination();
    master.connect(monitor); monitor.connect(AC.destination); master.connect(recDest);
    Object.values(SRC).forEach(routeSrc);
  }catch(e){ AC=null; }
}
function routeSrc(s){ if(!AC||s.gain||s.type==='image'||!s.el) return; try{ const n=AC.createMediaElementSource(s.el); const g=AC.createGain(); g.gain.value=0; n.connect(g); g.connect(master); s.gain=g; }catch(e){} }
function setVol(s,v){ if(s.gain) s.gain.gain.value=v; else { try{ s.el.volume=clamp(v,0,1); }catch(e){} } }
document.addEventListener('pointerdown', ensureAudio, {once:true});

/* ---------- canvas & rendering ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
const bgc=document.createElement('canvas'), bx=bgc.getContext('2d');
function fitCanvas(){ const r=stage.getBoundingClientRect(); const aw=r.width-24, ah=r.height-24; if(aw<=0||ah<=0) return; const k=Math.min(aw/cv.width, ah/cv.height); cv.style.width=Math.floor(cv.width*k)+'px'; cv.style.height=Math.floor(cv.height*k)+'px'; }
function setRes(w,h){ if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } fitCanvas(); dirty=true; }
function applyRatio(render=true){ const [w,h]=ratioWH(S.ratio,720); setRes(w,h); $('#ratioTag').textContent=S.ratio; if(render) dirty=true; }
const requestRender = () => { dirty=true; };

function drawable(c){ const s=SRC[c.srcId]; if(!s||!s.el) return null;
  if(s.type==='video'){ if(s.el.readyState<2||!s.el.videoWidth) return null; return {el:s.el,w:s.el.videoWidth,h:s.el.videoHeight}; }
  if(s.type==='image') return {el:s.el,w:s.el.naturalWidth,h:s.el.naturalHeight};
  return null; }

function filterStr(fx, blur){
  const p=PRESETS[fx.p]||{}; let b=(p.b||1)*(1+fx.bri/100), c=(p.c||1)*(1+fx.con/100), s=(p.s||1)*(1+fx.sat/100), sep=p.sep||0, h=p.h||0, g=p.g||0;
  if(fx.warm>0){ sep=Math.min(1,sep+fx.warm/100*.45); s*=1+fx.warm/400; } else if(fx.warm<0){ h+=fx.warm*.3; b*=1+fx.warm/-1000; }
  const parts=[];
  if(Math.abs(b-1)>.001) parts.push(`brightness(${b.toFixed(3)})`);
  if(Math.abs(c-1)>.001) parts.push(`contrast(${c.toFixed(3)})`);
  if(Math.abs(s-1)>.001) parts.push(`saturate(${s.toFixed(3)})`);
  if(sep>.001) parts.push(`sepia(${sep.toFixed(3)})`);
  if(g>.001) parts.push(`grayscale(${g})`);
  if(Math.abs(h)>.1) parts.push(`hue-rotate(${h.toFixed(1)}deg)`);
  if(blur>.1) parts.push(`blur(${blur.toFixed(1)}px)`);
  return parts.join(' ')||'none';
}

function drawColorClip(c2, W, H, c, local){
  const a=.7+local*.25, cx=W/2, cy=H/2, R=Math.hypot(W,H)/2;
  const g=c2.createLinearGradient(cx-Math.cos(a)*R, cy-Math.sin(a)*R, cx+Math.cos(a)*R, cy+Math.sin(a)*R);
  g.addColorStop(0,c.color); g.addColorStop(1,c.color2); c2.fillStyle=g; c2.fillRect(0,0,W,H);
  const blobs=[[.3,.3,.55,.9],[.75,.7,.5,1.3]];
  for(const [bx_,by,r,sp] of blobs){ const x=W*(bx_+.12*Math.sin(local*sp)), y=H*(by+.1*Math.cos(local*sp*.8)), rr=Math.max(W,H)*r;
    const rg=c2.createRadialGradient(x,y,0,x,y,rr); rg.addColorStop(0,'rgba(255,255,255,.22)'); rg.addColorStop(1,'rgba(255,255,255,0)'); c2.fillStyle=rg; c2.fillRect(0,0,W,H); }
}

function drawBg(c2,W,H,c){
  const bg=S.bg;
  if(bg.type==='color'){ c2.fillStyle=bg.color; c2.fillRect(0,0,W,H); return; }
  if(bg.type==='grad'){ const g=c2.createLinearGradient(0,0,W,H); g.addColorStop(0,'#5AC8FA'); g.addColorStop(.5,'#1E7BF0'); g.addColorStop(1,'#0A3A9A'); c2.fillStyle=g; c2.fillRect(0,0,W,H); return; }
  c2.fillStyle='#000'; c2.fillRect(0,0,W,H);
  const d=c&&drawable(c); if(!d) return;
  const div=6+bg.amt*.35, sw=Math.max(6,Math.round(W/div)), sh=Math.max(6,Math.round(H/div));
  if(bgc.width!==sw||bgc.height!==sh){ bgc.width=sw; bgc.height=sh; }
  const k=Math.max(sw/d.w, sh/d.h); bx.filter='blur(1px)'; bx.drawImage(d.el,(sw-d.w*k)/2,(sh-d.h*k)/2,d.w*k,d.h*k);
  c2.save(); c2.filter='brightness(.72) saturate(1.25)'; c2.imageSmoothingEnabled=true; c2.imageSmoothingQuality='high';
  c2.drawImage(bgc,-W*.05,-H*.05,W*1.1,H*1.1); c2.restore();
}

function drawMedia(c2,W,H,c,local,o){
  c2.save(); c2.filter=filterStr(c.fx,o.blur);
  if(c.kind==='color'){ c2.translate(o.offX,0); drawColorClip(c2,W,H,c,local); c2.restore(); return; }
  const d=drawable(c); if(!d){ c2.restore(); return; }
  c2.translate(W/2+o.offX,H/2); c2.rotate(c.tf.rot*Math.PI/180); c2.scale(c.tf.fh?-1:1, c.tf.fv?-1:1);
  const r90=c.tf.rot%180!==0, bw=r90?H:W, bh=r90?W:H;
  const k=(c.tf.fit==='fill'?Math.max(bw/d.w,bh/d.h):Math.min(bw/d.w,bh/d.h))*c.tf.zoom*o.scale;
  c2.drawImage(d.el,-d.w*k/2,-d.h*k/2,d.w*k,d.h*k); c2.restore();
}

function render(c2,W,H,time,ui){
  c2.save(); c2.setTransform(1,0,0,1,0,0); c2.filter='none'; c2.globalAlpha=1;
  const cur=currentAt(time);
  if(!cur){
    c2.fillStyle='#0B1220'; c2.fillRect(0,0,W,H);
    c2.fillStyle='rgba(255,255,255,.55)'; c2.font=`500 ${Math.round(W*.045)}px ${FONTS.plex}`; c2.textAlign='center'; c2.textBaseline='middle'; c2.fillText(t('emptyCanvas'),W/2,H/2);
  } else {
    const c=cur.c, len=cur.len, local=clamp(time-cur.start,0,len-.001), idx=cur.idx;
    const o={offX:0, scale:1, blur:0}; let over=null, overA=0;
    if(idx>0 && c.tr!=='none' && local<TD){ const p=ease(local/TD);
      if(c.tr==='fade'){over='#000';overA=1-p;} else if(c.tr==='white'){over='#fff';overA=1-p;}
      else if(c.tr==='zoom'){o.scale=1+.35*(1-p); over='#000'; overA=(1-p)*.5;} else if(c.tr==='slide'){o.offX=(1-p)*W;} else if(c.tr==='blur'){o.blur=(1-p)*W*.03;} }
    const nx=S.clips[idx+1];
    if(nx && nx.tr!=='none' && nx.tr!=='slide' && local>len-TD){ const p=ease((local-(len-TD))/TD);
      if(nx.tr==='fade'){over='#000';overA=Math.max(overA,p);} else if(nx.tr==='white'){over='#fff';overA=Math.max(overA,p);}
      else if(nx.tr==='zoom'){o.scale*=1+.12*p; over='#000'; overA=Math.max(overA,p*.5);} else if(nx.tr==='blur'){o.blur=Math.max(o.blur,p*W*.03);} }
    if(c.kind==='color') { c2.fillStyle='#000'; c2.fillRect(0,0,W,H); } else drawBg(c2,W,H,c);
    drawMedia(c2,W,H,c,local,o);
    if(c.fx.vig>0){ const rg=c2.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.hypot(W,H)/2); rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,`rgba(0,0,0,${(c.fx.vig/100*.8).toFixed(3)})`); c2.fillStyle=rg; c2.fillRect(0,0,W,H); }
    if(over&&overA>0){ c2.globalAlpha=clamp(overA,0,1); c2.fillStyle=over; c2.fillRect(0,0,W,H); c2.globalAlpha=1; }
  }
  drawTexts(c2,W,H,time,ui);
  c2.restore();
}

function rr(c2,x,y,w,h,r){ c2.beginPath(); c2.moveTo(x+r,y); c2.arcTo(x+w,y,x+w,y+h,r); c2.arcTo(x+w,y+h,x,y+h,r); c2.arcTo(x,y+h,x,y,r); c2.arcTo(x,y,x+w,y,r); c2.closePath(); }
function drawTexts(c2,W,H,time,ui){
  textBoxes=[];
  for(const tx of S.texts){
    if(time<tx.start||time>=tx.end) continue;
    const local=time-tx.start, rem=tx.end-time, A=.45;
    let alpha=1, dy=0, sc=1, txt=tx.text;
    const pin=clamp(local/A,0,1), pout=clamp(rem/A,0,1);
    if(tx.anim==='fade'){ alpha=Math.min(pin,pout); }
    else if(tx.anim==='pop'){ const p=pin; sc=p<1? .6+.4*(1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2)) : 1; alpha=Math.min(clamp(local/.15,0,1),pout); }
    else if(tx.anim==='slide'){ dy=(1-ease(pin))*H*.05; alpha=Math.min(ease(pin),pout); }
    else if(tx.anim==='type'){ const chars=[...tx.text]; txt=chars.slice(0,Math.floor(local*16)).join(''); alpha=pout; }
    const fs=tx.size/100*W, lh=fs*1.3;
    c2.save(); c2.globalAlpha=clamp(alpha,0,1); c2.font=`${tx.bold?700:400} ${fs}px ${FONTS[tx.font]||FONTS.plex}`; c2.textAlign='center'; c2.textBaseline='middle'; c2.direction='inherit';
    const all=tx.text.split('\n'), lines=txt.split('\n');
    const widths=all.map(l=>c2.measureText(l||' ').width); const bw=Math.max(...widths), bh=all.length*lh;
    const cx=tx.x*W, cy=tx.y*H+dy;
    c2.translate(cx,cy); c2.scale(sc,sc);
    const padX=fs*.45, padY=fs*.22;
    if(tx.style==='box'){ c2.fillStyle=tx.bg; rr(c2,-bw/2-padX,-bh/2-padY,bw+padX*2,bh+padY*2,fs*.3); c2.fill(); }
    if(tx.style==='shadow'){ c2.shadowColor='rgba(0,0,0,.55)'; c2.shadowBlur=fs*.25; c2.shadowOffsetY=fs*.06; }
    lines.forEach((l,i)=>{ const y=-bh/2+lh*(i+.5);
      if(tx.style==='outline'){ c2.lineJoin='round'; c2.lineWidth=fs*.14; c2.strokeStyle=isLight(tx.color)?'#000':'#fff'; c2.strokeText(l,0,y); }
      c2.fillStyle=tx.color; c2.fillText(l,0,y); });
    c2.restore();
    const box={id:tx.id,x:cx-bw/2-padX,y:tx.y*H-bh/2-padY,w:bw+padX*2,h:bh+padY*2};
    textBoxes.push(box);
    if(ui && sel && sel.type==='text' && sel.id===tx.id){ c2.save(); c2.setLineDash([8,6]); c2.lineWidth=2; c2.strokeStyle='#64D2FF'; rr(c2,box.x-4,box.y-4,box.w+8,box.h+8,10); c2.stroke(); c2.restore(); }
  }
}
function isLight(hex){ const n=parseInt(hex.slice(1),16); const r=n>>16&255,g=n>>8&255,b=n&255; return (r*299+g*587+b*114)/1000>150; }

/* ---------- playback ---------- */
function syncMedia(){
  const cur=currentAt(T);
  for(const s of Object.values(SRC)){
    if(s.type!=='video'||!s.el) continue;
    const isCur = cur && cur.c.kind==='video' && cur.c.srcId===s.id;
    if(isCur){
      const c=cur.c, local=clamp(T-cur.start,0,cur.len), target=c.in+local*c.speed;
      setVol(s, c.muted?0:c.vol);
      if(playing){
        if(Math.abs(s.el.playbackRate-c.speed)>.001) s.el.playbackRate=c.speed;
        if(s.el.paused){ if(target<c.out-.03){ if(Math.abs(s.el.currentTime-target)>.08) s.el.currentTime=target; s.blocked=false; s.el.play().catch(()=>{s.blocked=true;}); } }
        else if(!s.el.seeking && Math.abs(s.el.currentTime-target)>.4) s.el.currentTime=target;
      } else {
        if(!s.el.paused) s.el.pause();

const mediaBox=$('#mediaBox');
function makeThumb(el,w,h){ try{ const th=96, tw=Math.round(clamp(th*w/h,40,180)); const c=document.createElement('canvas'); c.width=tw; c.height=th; c.getContext('2d').drawImage(el,0,0,tw,th); return c.toDataURL('image/jpeg',.72); }catch(e){ return ''; } }
function makeWave(buf){
  try{ const ch=buf.getChannelData(0), N=400, step=Math.max(1,Math.floor(ch.length/N)); const c=document.createElement('canvas'); c.width=N*2; c.height=48; const g=c.getContext('2d'); g.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<N;i++){ let m=0; for(let j=i*step;j<Math.min(ch.length,(i+1)*step);j+=8){ const v=Math.abs(ch[j]); if(v>m) m=v; } const h=Math.max(2,m*44); g.fillRect(i*2,24-h/2,1.4,h); }
    return c.toDataURL('image/png'); }catch(e){ return ''; } }
async function decodeAudio(file){
  try{ const ab=await file.arrayBuffer(); const Off=window.OfflineAudioContext||window.webkitOfflineAudioContext; const oc=new Off(1,44100,44100);
    return await new Promise((res,rej)=>{ const p=oc.decodeAudioData(ab,res,rej); if(p&&p.catch) p.catch(rej); }); }catch(e){ return null; } }
function kindOf(f){ const ty=f.type||''; if(ty.startsWith('video')) return 'video'; if(ty.startsWith('image')) return 'image'; if(ty.startsWith('audio')) return 'audio';
  const ext=(f.name.split('.').pop()||'').toLowerCase(); if(['mp4','mov','webm','m4v','mkv'].includes(ext)) return 'video'; if(['jpg','jpeg','png','gif','webp','heic'].includes(ext)) return 'image'; if(['mp3','m4a','wav','aac','ogg','opus','flac'].includes(ext)) return 'audio'; return null; }

function loadSource(file,type){
  return new Promise(async (res,rej)=>{
    const url=URL.createObjectURL(file), id=uid(), s={id,type,url,name:file.name.replace(/\.[^.]+$/,''),duration:0,thumb:'',el:null};
    if(type==='image'){ const img=new Image(); img.onload=()=>{ s.el=img; s.thumb=makeThumb(img,img.naturalWidth,img.naturalHeight); SRC[id]=s; res(s); }; img.onerror=rej; img.src=url; return; }
    let buf=null; if(type==='audio') buf=await decodeAudio(file);
    const el=document.createElement(type); el.preload='auto'; el.playsInline=true; el.setAttribute('playsinline',''); el.src=url; mediaBox.appendChild(el);
    el.addEventListener('seeked',requestRender); el.addEventListener('loadeddata',requestRender);
    el.onerror=()=>rej(new Error('load'));
    el.onloadedmetadata=()=>{
      el.onloadedmetadata=null;
      s.duration = buf ? buf.duration : (isFinite(el.duration)?el.duration:0); s.el=el; SRC[id]=s; routeSrc(s);
      if(buf) s.wave=makeWave(buf);
      if(type==='video'){ const onSk=()=>{ el.removeEventListener('seeked',onSk); s.thumb=makeThumb(el,el.videoWidth,el.videoHeight); renderTimeline(); if(tab==='media') renderPanel(); }; el.addEventListener('seeked',onSk); el.currentTime=Math.min(.5,s.duration/3)||.01; }
      if(!s.duration){ rej(new Error('duration')); return; }
      res(s);
    };
  });
}
function addClipFromSrc(s){ const c=newClip(s.type,{srcId:s.id,name:s.name,in:0,out:s.duration,dur:3}); S.clips.push(c); sel={type:'clip',id:c.id}; return c; }

async function importFiles(list, forceAudio=false){
  const files=[...list].filter(f=>kindOf(f)); if(!files.length) return;
  if(S.sample && files.some(f=>!forceAudio && kindOf(f)!=='audio')){ S.clips=[]; S.texts=[]; S.sample=false; sel=null; T=0; }
  let added=0;
  for(const f of files){
    let k=kindOf(f); if(forceAudio) k='audio';
    try{ const s=await loadSource(f,k); if(k==='audio') addAudioFromSrc(s); else addClipFromSrc(s); added++; }
    catch(e){ toast(t('loadFail')+' '+f.name); }
  }
  if(added){ if(forceAudio||files.every(f=>kindOf(f)==='audio')) tab='audio'; else if(tab==='media'||tab==='export') tab='media'; commit(); renderAll(); toast(t('added')+' ('+added+')'); }
}

}
function pickMime(){ if(!window.MediaRecorder||!MediaRecorder.isTypeSupported) return '';
  for(const m of ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1,opus','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']) { try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
const BPS={480:2.5e6,720:5e6,1080:9e6};
function pExport(){
  const tot=total(), [w,h]=ratioWH(S.ratio,S.exp.q), mime=pickMime(), ext=mime.includes('mp4')?'MP4':'WebM';
  const mb=((BPS[S.exp.q]*(S.exp.fps>30?1.5:1)+160000)*tot/8/1048576);
  let o=head('export',t('exportSub'));
  if(exp){ const p=tot?Math.round(T/tot*100):0;
    return o+grp('', `<div class="kv"><span>${t('exporting')}</span><b id="expPct2">${p}%</b></div><div class="bar"><i id="expBar" style="width:${p}%"></i></div><p class="hint" style="margin:0">${t('exportHint')}</p><button class="btn danger block" data-act="cancelExport">${t('cancel')}</button>`); }
  if(result) o+=grp(t('done'), `<div class="result"><video src="${result.url}" controls playsinline></video></div><div class="kv"><span>${t('format')}</span><b>${result.ext.toUpperCase()} · ${(result.size/1048576).toFixed(1)} MB</b></div><button class="btn primary block" data-act="saveFile">${icon('download',18)} ${t('save')}</button><button class="btn block" data-act="newExport">${t('again')}</button>`);
  o+=grp(t('quality'), chips('s.exp.q',[[480,'480p'],[720,'720p HD'],[1080,'1080p Full HD']],S.exp.q));
  o+=grp(t('fps'), chips('s.exp.fps',[[24,'24'],[30,'30'],[60,'60']],S.exp.fps));
  o+=grp(t('summary'), `<div class="kv"><span>${t('duration')}</span><b>${fmt(tot)}</b></div><div class="kv"><span>${t('resolution')}</span><b>${w}×${h}</b></div><div class="kv"><span>${t('format')}</span><b>${ext}</b></div><div class="kv"><span>${t('estSize')}</span><b>~${mb.toFixed(1)} MB</b></div>`);
  o+=`<button class="btn primary block" data-act="export" ${tot?'':'disabled'}>${icon('export',18)} ${t('startExport')}</button><p class="hint" style="margin:0">${t('exportHint')}</p>`;
  return o;
}
const panel=$('#panel');
function renderPanel(){
  const map={media:pMedia,edit:pEdit,text:pText,audio:pAudio,filters:pFilters,canvas:pCanvas,export:pExport};
  const st=panel.scrollTop; panel.innerHTML=(map[tab]||pMedia)(); panel.scrollTop=st;
  panel.querySelectorAll('input[type=range]').forEach(paintRange);
  if(tab==='filters') drawPresetThumbs();
}
function paintRange(el){ const p=(el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--p',p+'%'); }

function propRoot(k){ const [r]=k.split('.'); if(r==='c') return selClip(); if(r==='t') return selText(); if(r==='a') return selAudio(); if(r==='f'){ const c=filterTarget(); return c?c.fx:null; } if(r==='s') return S; return null; }
function setProp(k,v){
  const root=propRoot(k); if(!root) return; const parts=k.split('.').slice(1); let o=root; for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  const last=parts[parts.length-1];
  if(k==='c.in') v=Math.min(v,root.out-.1); if(k==='c.out') v=Math.max(v,root.in+.1);
  if(k==='a.in') v=Math.min(v,root.out-.1); if(k==='a.out') v=Math.max(v,root.in+.1);
  if(k==='t.start') v=Math.min(v,root.end-.1); if(k==='t.end') v=Math.max(v,root.start+.1);
  if(k==='t.x'||k==='t.y') v=v>1.0001?v/100:v;
  o[last]=v; return v;
}
const TIMING_KEYS=/^(c\.(in|out|dur|speed)|t\.(start|end|text)|a\.(start|in|out))$/;
function onCtlInput(e){
  const el=e.target, k=el.dataset.k; if(!k) return;
  let v = el.type==='checkbox'?el.checked : el.type==='range'?parseFloat(el.value) : el.value;
  const nv=setProp(k,v);
  if(el.type==='range'){ if(nv!==undefined && k!=='t.x' && k!=='t.y' && nv!==v){ el.value=nv; } paintRange(el); const out=e.currentTarget.querySelector(`output[data-o="${k}"]`); if(out) out.textContent=fv(el.value,el.dataset.f); }
  if(qt && e.currentTarget===qtEl && /^c\.(speed|dur)$|^t\.text$/.test(k)){ const b=qtEl.querySelector('.qt-h b'), o=qtObj(); if(b&&o) b.textContent=qt.type==='text'?o.text.split('\n')[0]:clipLen(o).toFixed(1)+t('sec'); }
  if(TIMING_KEYS.test(k)){ renderTimeline(); updTime(); }
  if(k.startsWith('f.')) drawPresetThumbs();
  if(k==='c.color'||k==='c.color2') renderTimeline();
  if(el.type==='checkbox'||el.type==='color') commit();
  dirty=true;
}
function onCtlChange(e){ if(!e.target.dataset.k) return; commit(); if(e.target.type==='color'||e.target.tagName==='TEXTAREA') renderTimeline(); if(e.currentTarget===qtEl) renderPanel(); else if(qt) renderQT(); }
panel.addEventListener('input',onCtlInput); panel.addEventListener('change',onCtlChange);
qtEl.addEventListener('input',onCtlInput); qtEl.addEventListener('change',onCtlChange);

function parseV(v){ if(v==='true') return true; if(v==='false') return false; if(v!==''&&!isNaN(v)&&!/^#/.test(v)) return parseFloat(v); return v; }
const ACTIONS={
  set(b){ const k=b.dataset.k, v=parseV(b.dataset.v); setProp(k,v); if(k==='s.exp.q'||k==='s.exp.fps') result=null; commit(); renderPanel(); renderTimeline(); updTime(); renderQT(); },
  addColor(){ const c=newClip('color',{dur:3,color:'#5AC8FA',color2:'#0A3A9A'}); if(S.sample){S.clips=[];S.texts=[];S.sample=false;} S.clips.push(c); sel={type:'clip',id:c.id}; commit(); renderAll(); },
  pickAudio(){ $('#inAudio').click(); },
  clearSample(){ S.clips=[]; S.texts=[]; S.sample=false; sel=null; T=0; commit(); renderAll(); },
  addFromLib(b){ const s=SRC[b.dataset.v]; if(!s) return; addClipFromSrc(s); commit(); renderAll(); toast(t('added')); },
  split(){ splitAtHead(); },
  dup(){ const c=selClip(); if(!c) return; const i=S.clips.indexOf(c); const d=JSON.parse(JSON.stringify(c)); d.id=uid(); S.clips.splice(i+1,0,d); sel={type:'clip',id:d.id}; commit(); renderAll(); },
  del(){ const c=selClip(); if(!c) return; S.clips=S.clips.filter(x=>x!==c); sel=null; T=clamp(T,0,total()); commit(); renderAll(); toast(t('deleted')); },
  moveL(){ moveClip(-1); }, moveR(){ moveClip(1); },
  rot(){ const c=selClip(); if(!c) return; c.tf.rot=(c.tf.rot+90)%360; commit(); renderPanel(); dirty=true; },
  fh(){ const c=selClip(); if(!c) return; c.tf.fh=!c.tf.fh; commit(); renderPanel(); dirty=true; },
  fv(){ const c=selClip(); if(!c) return; c.tf.fv=!c.tf.fv; commit(); renderPanel(); dirty=true; },
  addText(){ const tot=total(); const st=T<tot-.2?T:0; const x=newText({start:st,end:Math.min(st+3,Math.max(tot,st+3)),y:.5}); S.texts.push(x); sel={type:'text',id:x.id}; commit(); renderAll(); setTimeout(()=>{ const a=$('#txArea'); if(a){ a.focus(); a.select(); } },30); },
  selText(b){ select('text',b.dataset.v); },
  dupText(){ const x=selText(); if(!x) return; const d=JSON.parse(JSON.stringify(x)); d.id=uid(); d.y=clamp(d.y+.08,.02,.98); S.texts.push(d); sel={type:'text',id:d.id}; commit(); renderAll(); },
  delText(){ const x=selText(); if(!x) return; S.texts=S.texts.filter(o=>o!==x); sel=null; commit(); renderAll(); },
  textStart(){ const x=selText(); if(!x) return; const d=x.end-x.start; x.start=T; x.end=T+d; commit(); renderAll(); },
  textEnd(){ const x=selText(); if(!x) return; x.end=Math.max(x.start+.1,T); commit(); renderAll(); },
  selAudio(b){ select('audio',b.dataset.v); },
  delAudio(){ const a=selAudio(); if(!a) return; const s=SRC[a.srcId]; if(s&&s.el) s.el.pause(); S.audios=S.audios.filter(o=>o!==a); sel=null; commit(); renderAll(); },
  audioHead(){ const a=selAudio(); if(!a) return; a.start=T; commit(); renderAll(); },
  rec(){ toggleRecord(); },
  preset(b){ const c=S.clips.find(x=>x.id===b.dataset.cid); if(!c) return; c.fx.p=b.dataset.v; commit(); renderPanel(); renderQT(); dirty=true; },
  fxAll(){ const c=filterTarget(); if(!c) return; S.clips.forEach(o=>{ if(o!==c) o.fx=JSON.parse(JSON.stringify(c.fx)); }); commit(); toast(t('applied')); dirty=true; },
  fxReset(){ const c=filterTarget(); if(!c) return; c.fx={p:'none',bri:0,con:0,sat:0,warm:0,vig:0}; commit(); renderPanel(); dirty=true; },
  ratio(b){ S.ratio=b.dataset.v; result=null; applyRatio(); commit(); renderPanel(); },
  export(){ startExport(); }, cancelExport(){ endExport(true); },
  saveFile(){ saveResult(); }, newExport(){ result=null; renderPanel(); }
};
panel.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACTIONS[b.dataset.act]; if(f) f(b); });
panel.addEventListener('keydown',e=>{ if(e.target.classList.contains('drop')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); $('#inMedia').click(); } });

function moveClip(d){ const c=selClip(); if(!c) return; const i=S.clips.indexOf(c), j=i+d; if(j<0||j>=S.clips.length) return; S.clips.splice(i,1); S.clips.splice(j,0,c); commit(); renderAll(); }
function splitAtHead(target){
  const L=layout(); const o=L.find(o=>T>o.start+.05&&T<o.start+o.len-.05&&(!target||o.c===target)); if(!o){ toast(t('splitHint')); return; }
  const c=o.c, local=T-o.start, i=S.clips.indexOf(c), b=JSON.parse(JSON.stringify(c)); b.id=uid(); b.tr='none';
  if(c.kind==='video'){ const cut=c.in+local*c.speed; c.out=cut; b.in=cut; } else { b.dur=c.dur-local; c.dur=local; }
  S.clips.splice(i+1,0,b); sel={type:'clip',id:b.id}; commit(); renderAll();
}

/* ---------- voice recording ---------- */
async function toggleRecord(){
  if(recState){ try{ recState.rec.stop(); }catch(e){} return; }
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream); const chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=async()=>{ stream.getTracks().forEach(x=>x.stop()); recState=null; const type=rec.mimeType||'audio/webm'; const ext=type.includes('mp4')?'m4a':'webm';
      const f=new File(chunks,`${lang==='ar'?'تعليق صوتي':'Voiceover'} ${S.audios.length+1}.${ext}`,{type}); await importFiles([f],true); renderPanel(); };
    rec.start(); recState={rec}; renderPanel(); toast(t('recording'));
  }catch(e){ recState=null; toast(t('micBlocked')); renderPanel(); }
}

/* ---------- export ---------- */
function waitReady(){ return new Promise(r=>{ const cur=currentAt(0); const s=cur&&cur.c.kind==='video'?SRC[cur.c.srcId]:null; if(!s||!s.el) return setTimeout(r,120);
  const done=()=>{ s.el.removeEventListener('seeked',done); setTimeout(r,60); }; s.el.addEventListener('seeked',done); s.el.currentTime=cur.c.in+.001; setTimeout(done,800); }); }
async function startExport(){
  if(exp) return; const tot=total(); if(tot<=0){ toast(t('nothingToExport')); return; }
  if(!window.MediaRecorder||!cv.captureStream){ toast(t('noRecorder')); return; }
  ensureAudio(); pause(); result=null;
  const q=S.exp.q, fps=S.exp.fps, [w,h]=ratioWH(S.ratio,q); setRes(w,h); sel=sel&&sel.type==='text'?null:sel;
  const stream=cv.captureStream(fps);
  if(recDest) recDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const mime=pickMime(), bps=BPS[q]*(fps>30?1.5:1);
  let rec; try{ rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:bps,audioBitsPerSecond:160000}:{videoBitsPerSecond:bps}); }
  catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ toast(t('noRecorder')); applyRatio(); return; } }
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  exp={rec,chunks,stream,mime:rec.mimeType||mime||'video/webm',cancelled:false,ending:false};
  rec.onstop=finishExport;
  if(monitor) monitor.gain.value=0;
  $('#expOv').hidden=false; $('#expPct').textContent='0%'; tab='export'; renderTabs(); renderPanel();
  T=0; dirty=true; syncMedia(); await waitReady(); if(!exp) return;
  render(ctx,cv.width,cv.height,0,false);
  rec.start(500); play();
}
function updExpProgress(){ const tot=total(); const p=tot?Math.min(100,Math.round(T/tot*100)):0; $('#expPct').textContent=p+'%'; const a=$('#expPct2'), b=$('#expBar'); if(a) a.textContent=p+'%'; if(b) b.style.width=p+'%'; }
function endExport(cancel){ if(!exp) return; exp.cancelled=!!cancel; pause(); try{ if(exp.rec.state!=='inactive') exp.rec.stop(); else finishExport(); }catch(e){ finishExport(); } }
function finishExport(){
  if(!exp) return; const e=exp; exp=null;
  e.stream.getVideoTracks().forEach(x=>x.stop());
  if(monitor) monitor.gain.value=1; $('#expOv').hidden=true; applyRatio(); T=0; updTime(); renderTimeline();
  if(!e.cancelled && e.chunks.length){ const type=e.mime.split(';')[0]; const blob=new Blob(e.chunks,{type}); if(result) URL.revokeObjectURL(result.url); result={blob,url:URL.createObjectURL(blob),size:blob.size,ext:type.includes('mp4')?'mp4':'webm'}; }
  renderPanel();
}
async function saveResult(){
  if(!result) return; const d=new Date(), p=n=>String(n).padStart(2,'0');
  const name=`laqta-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${result.ext}`;
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads'); }catch(e){ dl=null; }
  if(dl){ try{ await dl.save({filename:name,data:result.blob}); toast(t('saved')); }catch(err){ toast(err&&err.code==='declined'?t('declined'):t('saveUnavailable')); } return; }
  const a=document.createElement('a'); a.href=result.url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- chrome: header, transport, theme, language ---------- */
function effTheme(){ const a=document.documentElement.getAttribute('data-theme'); if(a==='dark'||a==='light') return a; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
function applyTheme(th){ if(th) document.documentElement.setAttribute('data-theme',th); const d=effTheme()==='dark'; $('#themeBtn').innerHTML=icon(d?'sun':'moon',19); $('#themeBtn').setAttribute('aria-label',d?t('themeLight'):t('themeDark')); }
$('#themeBtn').addEventListener('click',()=>{ const n=effTheme()==='dark'?'light':'dark'; store.set('laqta.theme',n); applyTheme(n); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());

function applyLang(){
  const h=document.documentElement; h.lang=lang; h.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('#langBtn').innerHTML=icon('globe',17)+`<span>${lang==='ar'?'EN':'عربي'}</span>`;
  const tips={undoBtn:'undo',redoBtn:'redo',startBtn:'toStart',playBtn:'play',splitBtn:'splitAt',addBtn:'addMedia',zoomIn:'zoomIn',zoomOut:'zoomOut',hdrExport:'export'};
  for(const [id,k] of Object.entries(tips)){ const el=document.getElementById(id); el.title=t(k); el.setAttribute('aria-label',t(k)); }
  applyTheme(); renderTabs(); renderPanel(); renderTimeline(); dirty=true;
}
$('#langBtn').addEventListener('click',()=>{ lang=lang==='ar'?'en':'ar'; store.set('laqta.lang',lang);
  if(S.sample && S.texts.length===2){ S.texts[0].text=t('sampleTitleText'); S.texts[1].text=t('sampleSubText'); lastSnap=snap(); }
  applyLang(); });

$('#logo').innerHTML=icon('logo',22);
$('#hdrExportIc').innerHTML=icon('export',18);
$('#undoBtn').innerHTML=icon('undo',19); $('#redoBtn').innerHTML=icon('redo',19);
$('#startBtn').innerHTML=icon('start',18); $('#splitBtn').innerHTML=icon('scissors',19); $('#addBtn').innerHTML=icon('plus',20);
{ const ls=$('#tlLabels').children; ls[0].innerHTML=icon('film',16); ls[1].innerHTML=icon('text',15); ls[2].innerHTML=icon('music',15); }
$('#zoomIn').innerHTML=icon('zoomIn',17); $('#zoomOut').innerHTML=icon('zoomOut',17);
$('#undoBtn').addEventListener('click',undo); $('#redoBtn').addEventListener('click',redo);
$('#startBtn').addEventListener('click',()=>{ if(exp) return; pause(); seek(0); scrollToT(); });
$('#playBtn').addEventListener('click',()=>{ if(!exp) togglePlay(); });
$('#splitBtn').addEventListener('click',()=>{ if(!exp) splitAtHead(); });
$('#addBtn').addEventListener('click',()=>$('#inMedia').click());
$('#zoomIn').addEventListener('click',()=>zoomTl(1.4)); $('#zoomOut').addEventListener('click',()=>zoomTl(1/1.4));
$('#hdrExport').addEventListener('click',()=>{ tab='export'; renderTabs(); renderPanel(); if(innerWidth<900) panel.scrollIntoView({behavior:'smooth',block:'start'}); });

document.addEventListener('keydown',e=>{
  const tg=e.target; if(tg.matches('input:not([type=range]):not([type=checkbox]),textarea')) return;
  if(e.code==='Space'){ e.preventDefault(); if(!exp) togglePlay(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if((e.key==='Delete'||e.key==='Backspace')&&sel&&!exp){ e.preventDefault(); ({clip:ACTIONS.del,text:ACTIONS.delText,audio:ACTIONS.delAudio})[sel.type](); }
  else if(e.key.toLowerCase()==='s'&&!e.ctrlKey&&!e.metaKey&&!exp) splitAtHead();
});

let toastTimer=0;
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }

function renderAll(){ renderTabs(); renderTimeline(); renderPanel(); updTime(); updUndo(); if(qt) renderQT(); dirty=true; }

/* ---------- boot ---------- */
const savedTab=store.get('laqta.tab'); if(savedTab && TABS.some(x=>x[0]===savedTab)) tab=savedTab;
const savedTheme=store.get('laqta.theme'); if(savedTheme==='dark'||savedTheme==='light') document.documentElement.setAttribute('data-theme',savedTheme);
if(lang==='en' && S.sample){ S.texts[0].text=t('sampleTitleText'); S.texts[1].text=t('sampleSubText'); lastSnap=snap(); }
applyRatio(); applyLang(); updPlayBtn(); updTime(); updUndo();
new ResizeObserver(()=>{ fitCanvas(); renderTimeline(); }).observe(stage);
addEventListener('resize',()=>{ fitCanvas(); renderTimeline(); placeQT(); });
if(document.fonts){ Promise.all(['700 20px "IBM Plex Sans Arabic"','400 20px "Lalezar"','700 20px "Amiri"','600 20px "Reem Kufi"'].map(f=>document.fonts.load(f,'لقطة Aa').catch(()=>{}))).then(()=>{ dirty=true; }); document.fonts.ready.then(()=>{ dirty=true; }); }
requestAnimationFrame(frame);
})();
</script>
